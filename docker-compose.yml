version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: smarttraffic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarttraffic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-smarttraffic}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarttraffic}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarttraffic-net

  redis:
    image: redis:7-alpine
    container_name: smarttraffic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarttraffic-net

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: smarttraffic-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    networks:
      - smarttraffic-net

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: smarttraffic-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smarttraffic}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-smarttraffic}
      REDIS_URL: redis://redis:6379
      MQTT_BROKER: mqtt-broker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    networks:
      - smarttraffic-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: smarttraffic-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - smarttraffic-net

networks:
  smarttraffic-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
  mosquitto-logs:
