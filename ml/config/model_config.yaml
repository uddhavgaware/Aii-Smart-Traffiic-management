model:
  architecture: yolov8s  # yolov8n, yolov8s, yolov8m
  weights: models/checkpoints/best.pt  # path to trained weights
  pretrained_fallback: yolov8s.pt  # use if no custom weights

  classes:
    # Normal vehicles
    0: car
    1: motorcycle
    2: bus
    3: truck
    4: auto_rickshaw
    # Emergency vehicles
    5: ambulance
    6: fire_brigade

  num_classes: 7
  confidence_threshold: 0.25
  iou_threshold: 0.55
  max_detections: 300
  input_size: 832

inference:
  device: cuda  # cuda or cpu
  fp16: true  # half precision for RTX 3050
  batch_size: 1  # per camera
  warmup_iterations: 3

tracking:
  algorithm: bytetrack
  max_age: 30  # frames before track deleted
  min_hits: 1  # confirm tracks immediately for low-latency live display
  activation_threshold: 0.15
  match_threshold: 0.90
  iou_threshold: 0.3
  frame_rate: 15

density:
  thresholds:
    low: 4
    normal: 10
    medium: 18
    high: 28
    jam: 999

  count_weight: 0.35
  roi_coverage_weight: 0.20
  queue_weight: 0.25
  speed_weight: 0.20

speed:
  estimation_method: optical_flow  # optical_flow, homography
  calibrated: false  # requires camera calibration
  label_as_estimate: true  # always label uncalibrated speeds

prediction:
  window_size: 30  # seconds of history to use
  horizon: 45  # seconds to predict ahead
  method: exponential_smoothing  # moving_average, exp_smoothing, random_forest

server:
  host: 0.0.0.0
  port: 8001
  api_key_header: X-ML-API-Key
