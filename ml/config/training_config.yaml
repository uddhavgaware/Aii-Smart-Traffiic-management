training:
  data_yaml: datasets/traffic_dataset/data.yaml
  model: yolov8n.pt  # start from pretrained
  epochs: 100
  imgsz: 640
  batch: 16  # adjust based on available VRAM (reduce to 8 for 4GB VRAM)
  device: 0  # GPU 0
  workers: 4
  project: models/training_runs
  name: traffic_v1

  # Augmentation settings
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 5.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0

  # Early stopping
  patience: 20

  optimizer: AdamW
  lr0: 0.01
  lrf: 0.01

evaluation:
  conf_threshold: 0.5
  iou_threshold: 0.5
  save_plots: true
  save_json: true
